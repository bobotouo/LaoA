name: Strategy E Pre-market

# 盘前预测 · 大盘风险监控（策略E --preopen 模式）
# 每个交易日盘前跑两波（由 Cloudflare Cron 准点触发，见 cloudflare/）：
#   第一波 北京 09:25（竞价定型）
#   第二波 北京 09:36 复测（开盘后复核）
# 此处只保留手动入口，避免 GitHub schedule 延迟/漏跑。
on:
  workflow_dispatch: {}        # Cloudflare Cron / Actions 页面 "Run workflow"

permissions:
  contents: write

concurrency:
  group: daily-e-premarket
  cancel-in-progress: false

jobs:
  forecast:
    name: Pre-market Risk Forecast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 全球外围数据(A50/黄金/原油/美元指数/VIX/美股/港股)海外兜底用 yfinance
          pip install yfinance

      - name: Run strategy E pre-market forecast and publish
        run: |
          mkdir -p runs
          cd strategy
          python screen_strategy_e.py \
            --preopen \
            --publish-url "https://lao-a.bobotou118.dpdns.org/api/strategy/e" \
            --data-url "https://lao-a.bobotou118.dpdns.org/api/market/e-data" \
            || true
        env:
          TZ: "Asia/Shanghai"
          # 海外 runner 直连不到新浪/腾讯/东财。解决方案：
          #   1. 市场宽度/涨跌停/上证快照 → 经已部署 API(/api/market/e-data)中转
          #   2. 全球外围(A50/黄金/原油/美元指数/VIX/美股/港股) → yfinance 兜底
          #   3. 新浪本地缓存(集合竞价快照)不可用，但已由远程宽度替代
          E_NO_SINA_CACHE: "1"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: market-risk-results
          path: runs/
          if-no-files-found: warn

      - name: Commit results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f runs/ 2>/dev/null || true
          git commit -m "chore: update market risk $(date +%F)" 2>/dev/null || echo "nothing to commit"
          git push
